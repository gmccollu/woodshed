# CI: test on Linux, Windows and macOS, fuzz the parsers, check SNMP interop with
# net-snmp, apply the setup helper's Tested snippets to the real tools, and
# check that every package (deb, rpm, MSI, pkg) still builds.
# Nothing is published.
#
# Uses only the standard actions/* actions (pinned by commit SHA, version in the comment) and
# `go run` for tools.
name: CI

on:
  push:
    # ci/install-smoke has its own workflow (install-smoke.yml); don't spend the
    # macOS and Windows minutes twice on every push there.
    branches: ["**", "!ci/install-smoke"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GORELEASER_VERSION: v2.20.1
  NODE_VERSION: "24"
  WIX_VERSION: "5.0.2"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            race: -race
          - os: macos-latest
            race: -race
          # -race needs cgo and a C toolchain; the Windows runners make that slow and flaky.
          - os: windows-latest
            race: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the frontend
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          npm ci
          npm run --if-present check
          npm run build

      - name: go vet
        run: go vet ./...

      # -timeout is a safety net above Go's 10 min default (one package's tests
      # under -race on macOS reached it, CI run 43625655826); a package should
      # finish in a small part of it.
      - name: go test
        run: go test ${{ matrix.race }} -timeout 20m ./...

      # The heavy internal/search variants at full size, once, without -race.
      - name: Long search tests without -race
        if: matrix.os == 'ubuntu-latest'
        env:
          WOODSHED_LONG_TESTS: "1"
        run: go test -count=1 -timeout 20m ./internal/search/...

      # The 10,000-device timing limits apply without -race only (instrumented
      # SQLite is ~25x slower on these runners); results are checked under -race above.
      - name: Scale test without -race
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        run: go test -count=1 -timeout 20m -run 'Scale|10000' -v ./internal/server/...

      # Process CPU per UDP message at 10, 100, 500 and 2,000 msg/s (syslog and traps, sender in a
      # child process), for this build's fast path and for every datagram through the queue as in
      # 1.2.0-rc1, printed side by side. It fails only if messages go missing. Windows is where
      # rc1's cost showed (the 1.2.0-rc1 lab: about a core at 500 msg/s).
      - name: CPU per message (printed)
        env:
          WOODSHED_CPU: "1"
        run: go test -count=1 -timeout 10m -run "TestCPUPerMessage$" -v ./internal/loadgen/

      - name: go build
        run: |
          short=${GITHUB_SHA::7}
          go build -trimpath -ldflags "-X main.version=0.0.0-ci+$short -X main.commit=$short" -o dist/ ./cmd/woodshed
          ./dist/woodshed version

  # arm64 runners (ubuntu-24.04-arm, windows-11-arm; both available to this repo, checked
  # 2026-11-11). A job asking for a label the repo doesn't have waits forever, so set the repo
  # variable ARM_RUNNERS=false (Settings -> Secrets and variables -> Actions -> Variables) to
  # turn these off if that ever changes, e.g. on a fork.
  test-arm:
    name: test (${{ matrix.os }})
    if: ${{ vars.ARM_RUNNERS != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            race: -race
          - os: windows-11-arm
            race: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the frontend
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ${{ matrix.race }} -timeout 20m ./...

      - name: go build
        run: |
          go build -trimpath -o dist/ ./cmd/woodshed
          ./dist/woodshed version

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Fuzz every target for 30 s
        run: scripts/fuzz.sh 30s ./internal/...

  # SNMP interop (SPEC §11.6): the distribution's net-snmp command-line tools,
  # installed in CI only and never a dependency, send v1/v2c traps, v2c informs
  # and v3 traps and informs at every level and protocol combination the tools
  # offer: first to a test listener built on internal/snmp (TestInterop), then
  # to a real running server, its SNMP listener, receiver and store, with the v3
  # users added through /api/snmp/users, every trap found once by the trap
  # search and every inform answered (TestServerInterop). Secrets go in a
  # temporary snmp.conf, not on the command line. Protocols the build lacks are
  # skipped and listed in the job summary; the ones below must be there.
  snmp-interop:
    name: snmp interop (net-snmp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install net-snmp's command-line tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends snmp
          snmptrap --version
      - name: Interop (TestInterop)
        env:
          WOODSHED_SNMP_INTEROP: "1"
          WOODSHED_SNMP_INTEROP_REQUIRE: md5,sha,sha-224,sha-256,sha-384,sha-512,aes-128
        run: go test -count=1 -run '^TestInterop$' -v ./internal/snmp/
      - name: Interop against the server (TestServerInterop)
        env:
          WOODSHED_SNMP_INTEROP: "1"
          WOODSHED_SNMP_INTEROP_REQUIRE: md5,sha,sha-224,sha-256,sha-384,sha-512,aes-128
        run: go test -count=1 -run '^TestServerInterop$' -v ./internal/server/

  # SNMP poll interop (SPEC §12.8): the distribution's net-snmp snmpd, installed in
  # CI only and never a dependency, is the polled agent, on a high port on
  # loopback with a generated snmpd.conf (the community and the v3 users'
  # passphrases are in that file, never on a command line). TestPollInterop polls
  # it with v1, v2c and v3 (noAuthNoPriv, each auth with noPriv, each priv with
  # SHA-256, MD5 with DES), checks discovery, real loopback counters with traffic
  # and HOST-RESOURCES CPU and memory, then restarts snmpd and expects a restart
  # marker with engineBoots up. Protocols the build lacks are skipped and listed
  # in the job summary; the ones below must be there.
  snmp-poll-interop:
    name: snmp poll interop (net-snmp snmpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install net-snmp's agent
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends snmpd
          /usr/sbin/snmpd -v
      - name: Poll interop (TestPollInterop)
        env:
          WOODSHED_SNMP_POLL_INTEROP: "1"
          WOODSHED_SNMP_POLL_INTEROP_REQUIRE: md5,sha,sha-224,sha-256,sha-384,sha-512,aes-128,engineboots
        run: PATH="$PATH:/usr/sbin" go test -count=1 -run '^TestPollInterop$' -v ./internal/poller/

  flow-interop:
    name: flow interop (softflowd, pmacct, tshark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install softflowd, pmacct and tshark
        run: |
          sudo apt-get update -qq
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends softflowd tshark tcpdump
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends pmacct || echo "pmacct not installable: the test skips it"
          softflowd -h 2>&1 | head -1 || true
          tshark --version | head -1
      - name: Flow interop (TestFlowInterop, TestSyntheticPcap)
        env:
          WOODSHED_FLOW_INTEROP: "1"
        run: PATH="$PATH:/usr/sbin" go test -count=1 -run '^(TestFlowInterop|TestSyntheticPcap)$' -v ./internal/server/

  # Setup helper (SPEC §13.5): the snippets of every template marked "Tested",
  # generated by a real running server's POST /api/setup/snippet and applied to
  # the distribution's own tools, installed in CI only and never a dependency:
  # rsyslog (syslog over UDP, TCP and TLS, with Woodshed's CA), snmpd and
  # snmptrap (traps v2c and v3, and snmpd answering the poller v2c and v3).
  # Each message or trap must arrive exactly once. softflowd replays the flow
  # interop test's synthetic pcap (written in Go) as flow v9 and IPFIX, and
  # every flow must be stored once with the pcap's counts.
  # TestSetupTestedTemplatesHaveCI fails a template marked Tested that no case
  # here applies.
  setup-snippets:
    name: setup snippets (rsyslog, net-snmp, softflowd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install rsyslog, its TLS driver, net-snmp and softflowd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rsyslog rsyslog-gnutls snmpd snmp softflowd
          /usr/sbin/rsyslogd -v | head -1
          /usr/sbin/snmpd -v | grep -i version
          snmptrap --version
      - name: Apply the Tested snippets (TestSetupSnippets)
        env:
          WOODSHED_SETUP_INTEROP: "1"
          WOODSHED_SETUP_INTEROP_REQUIRE: sha-256
        run: PATH="$PATH:/usr/sbin" go test -count=1 -timeout 15m -run '^TestSetupSnippets$' -v ./internal/server/

  packaging:
    name: packaging (goreleaser, deb, rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Lint the packaging scripts
        run: scripts/lint-packaging.sh

      # Every archive and installer ships THIRD_PARTY_NOTICES.txt; regenerate it when a
      # dependency changes: scripts/third_party_notices.py
      - name: THIRD_PARTY_NOTICES.txt is current
        run: scripts/third_party_notices.py --check

      - name: CHANGELOG.md gives release notes
        run: scripts/release-notes.sh v0.0.0-ci >/dev/null

      - name: goreleaser check
        run: go run github.com/goreleaser/goreleaser/v2@"$GORELEASER_VERSION" check

      - name: Snapshot build (nothing is published)
        env:
          WOODSHED_OWNER: ${{ github.repository_owner }}
          WOODSHED_REPO: ${{ github.event.repository.name }}
        run: go run github.com/goreleaser/goreleaser/v2@"$GORELEASER_VERSION" release --snapshot --clean --skip=publish

      # The snapshot version is a prerelease (0.0.1-snapshot.<sha>), like an -rc tag.
      - name: Release file names survive GitHub's asset naming
        run: scripts/check-asset-names.sh dist

      - name: Inspect the deb and rpm
        run: |
          set -x
          deb=$(ls dist/*_amd64.deb)
          # The package version keeps "~" (sorts before the release); only the file name drops it.
          dpkg-deb -f "$deb" Version | grep -q '~snapshot' || { echo "deb Version lost the ~"; exit 1; }
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          for f in /usr/bin/woodshed /usr/lib/systemd/system/woodshed.service /etc/sysctl.d/60-woodshed.conf; do
            dpkg-deb --contents "$deb" | grep -q " \.$f\$" || { echo "missing $f in $deb"; exit 1; }
          done
          if command -v rpm >/dev/null; then
            rpm -qip dist/*.x86_64.rpm
            rpm -qlp --scripts dist/*.x86_64.rpm
          fi
          # The desktop entry that opens the UI, and its icon, in both packages.
          for f in /usr/share/applications/woodshed.desktop /usr/share/icons/hicolor/scalable/apps/woodshed.svg; do
            dpkg-deb --contents "$deb" | grep -q " \.$f\$" || { echo "missing $f in $deb"; exit 1; }
            if command -v rpm >/dev/null; then
              rpm -qlp dist/*.x86_64.rpm | grep -qx "$f" || { echo "missing $f in the rpm"; exit 1; }
            fi
          done
          if command -v desktop-file-validate >/dev/null || sudo apt-get install -y -qq desktop-file-utils >/dev/null 2>&1; then
            desktop-file-validate packaging/linux/woodshed.desktop
          fi
          systemd-analyze verify packaging/linux/woodshed.service 2>&1 | grep -v "Command /usr/bin/woodshed is not executable" || true

  windows-msi:
    name: installer (windows msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.0.x
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version $env:WIX_VERSION
      - name: Build the MSI (x64)
        shell: pwsh
        run: ./packaging/windows/build-msi.ps1 -Version 0.0.0 -Arch x64 -OutDir dist/msi
      - name: List the MSI
        shell: pwsh
        run: Get-ChildItem dist/msi
      # Installs it for real on this disposable runner: the data-folder ACL reset over a hostile
      # pre-existing folder, and the service's reduced privileges.
      - name: MSI hardening checks
        shell: pwsh
        run: ./scripts/smoke/msi-hardening.ps1 -Msi (Resolve-Path dist/msi/*.msi).Path

  macos-pkg:
    name: installer (macos pkg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build the pkg
        run: packaging/macos/build-pkg.sh --version 0.0.0 --out dist/macos
      - name: List the payload and scripts
        run: |
          pkgutil --payload-files dist/macos/*.pkg
          pkgutil --expand dist/macos/*.pkg "$RUNNER_TEMP/pkg"
          ls -la "$RUNNER_TEMP/pkg/woodshed-component.pkg/Scripts"
